[project]
name = "ledgerlens"
version = "0.1.0"
description = "Reproducible evaluation harness for invoice extraction"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.3,<9"]

[project.scripts]
eval = "eval.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["extractor", "eval"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
