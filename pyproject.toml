[project]
name = "ledgerlens"
version = "0.1.0"
description = "Reproducible evaluation harness for invoice extraction"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1",
  "pytest>=8.3,<9",
]

[project.scripts]
eval = "eval.cli:main"
ledgerlens-web = "eval.web:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["extractor", "eval"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
